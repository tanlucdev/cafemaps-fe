<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Cafe Maps — Phát nhạc Giáng sinh</title>
<desc id="desc">Nút nhạc trên nền tròn kem, nốt nhạc đỏ đội mũ Noel, lá holly và ngôi sao nhỏ.</desc>
<defs>
  <radialGradient id="bg" cx="33%" cy="25%" r="84%"><stop stop-color="#fffdf5"/><stop offset="0.70" stop-color="#fff8ec"/><stop offset="1" stop-color="#f8ead8"/></radialGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b73748"/><stop offset="0.58" stop-color="#9d2536"/><stop offset="1" stop-color="#7e2635"/></linearGradient>
  <linearGradient id="note" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bf3543"/><stop offset="0.60" stop-color="#ad2938"/><stop offset="1" stop-color="#8d2432"/></linearGradient>
  <linearGradient id="hat" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#d34c51"/><stop offset="0.5" stop-color="#bc2d3c"/><stop offset="1" stop-color="#8f2633"/></linearGradient>
  <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf6"/><stop offset="1" stop-color="#f2e3cb"/></linearGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#a1b887"/><stop offset="1" stop-color="#527e62"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6d2d25" flood-opacity=".17"/></filter>
</defs>
<!-- circular touch-friendly button with transparent outside -->
<circle cx="256" cy="256" r="246" fill="url(#ring)"/>
<circle cx="256" cy="256" r="234" fill="url(#bg)" stroke="#fff1dc" stroke-width="3"/>
<circle cx="256" cy="256" r="214" fill="none" stroke="#e8d0b4" stroke-width="5"/>
<path d="M78 169C106 109 156 78 216 63" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="6" stroke-linecap="round"/>
<!-- music note with espresso outline -->
<g filter="url(#shadow)" stroke="#4d322a" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
<path d="M255 132 L286 139 L286 324 C286 333 282 339 270 347 L254 356 Z" fill="url(#note)"/>
<path d="M276 137 C321 143 342 160 347 190 C352 210 344 222 331 220 C317 218 315 204 315 191 C313 177 302 165 279 159 Z" fill="url(#note)"/>
<ellipse cx="204" cy="338" rx="59" ry="44" transform="rotate(-22 204 338)" fill="url(#note)"/>
</g>
<path d="M265 147V309" fill="none" stroke="#df5960" stroke-width="5" stroke-linecap="round" opacity=".42"/>
<path d="M158 321 C170 302 201 295 225 304" stroke="#d65b65" stroke-width="5" stroke-linecap="round" opacity=".42" fill="none"/>
<!-- small relaxed santa hat resting at a jaunty angle on musical note -->
<path d="M230 112 C240 88 264 65 297 66 C330 65 350 84 358 106 C351 97 344 94 331 97 C340 102 354 113 364 122 C335 120 289 113 230 123 Z" fill="url(#hat)" stroke="#4b302b" stroke-width="7" stroke-linejoin="round"/>
<path d="M241 105 C260 75 298 71 320 84" fill="none" stroke="#e66c6d" stroke-width="5" stroke-linecap="round" opacity=".65"/>
<path d="M231 129 C261 113 314 109 353 125" fill="none" stroke="#ead3b9" stroke-width="22" stroke-linecap="round"/>
<path d="M230 127 C259 114 309 114 352 125" fill="none" stroke="url(#cream)" stroke-width="16" stroke-linecap="round"/>
<path d="M248 121 C281 114 313 116 332 120" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="4" stroke-linecap="round"/>
<circle cx="365" cy="122" r="25" fill="#e7d1b4"/>
<circle cx="365" cy="119" r="20" fill="url(#cream)"/>
<circle cx="357" cy="112" r="7" fill="#fff" opacity=".62"/>
<!-- small 4-point golden sparkle -->
<path d="M124 190 Q134 214 151 222 Q132 230 124 253 Q114 230 97 222 Q114 214 124 190 Z" fill="#e7a844"/>
<path d="M125 205 Q131 218 139 222" stroke="#ffe5a5" fill="none" stroke-width="3" stroke-linecap="round"/>
<!-- holly leaves/berries at lower edge of note -->
<g stroke="#3e604b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
<path d="M316 365 C292 356 282 341 280 323 C310 323 328 339 336 361 Z" fill="url(#leaf)"/>
<path d="M331 359 C339 330 357 312 391 312 C390 341 372 360 345 373 Z" fill="#60936d"/>
</g>
<path d="M294 337L329 365M372 328L341 362" fill="none" stroke="#bfd0a7" stroke-width="3" stroke-linecap="round"/>
<g stroke="#6f3438" stroke-width="5"><circle cx="350" cy="374" r="22" fill="#b72d3b"/><circle cx="378" cy="369" r="18" fill="#c7474b"/></g>
<circle cx="345" cy="367" r="7" fill="#ffbbc1" opacity=".68"/><circle cx="374" cy="363" r="5" fill="#ffd6d0" opacity=".6"/>
</svg>